
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星穹迷宫 | 独一无二的数字宇宙</title>
    <style>
        /* 声明CSS变量 - 确保唯一性 */
        :root {
            --primary: #1e3a8a;
            --secondary: #0f4c81;
            --accent: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #0f172a;
            --light: #f1f5f9;
        }

        /* 重置基本样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(25, 118, 210, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(168, 85, 245, 0.1) 0%, transparent 40%);
            min-height: 100vh;
            perspective: 1000px;
            overflow-y: auto;
        }

        /* 星空背景 */
        .star-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background-color: var(--light);
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        /* 3D迷宫容器 */
        .maze-container {
            max-width: 1200px;
            margin: 60px auto 30px;
            padding: 0 20px;
            position: relative;
        }

        /* 迷宫标题 */
        .maze-title {
            text-align: center;
            margin: 40px 0 50px;
            font-size: 3.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            animation: title-float 4s ease-in-out infinite;
        }

        /* 迷宫说明 */
        .maze-desc {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 60px;
            font-size: 1.2rem;
            line-height: 1.6;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        /* 迷宫网格 */
        .maze-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 12px;
            margin-top: 30px;
        }

        .cell {
            height: 120px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            background-size: cover;
            background-position: center;
            transform: translateZ(0);
        }

        .cell:hover {
            transform: scale(1.03) translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent);
            z-index: 10;
        }

        .cell-content {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            z-index: 2;
        }

        .cell-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
            color: var(--accent);
        }

        .cell-desc {
            font-size: 1rem;
            opacity: 0.85;
            line-height: 1.4;
        }

        /* 3D效果 */
        .cell-3d {
            transform-style: preserve-3d;
            height: 100%;
            width: 100%;
        }

        .cell-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--light);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .face-top {
            transform: rotateX(90deg) translateZ(60px);
            background: linear-gradient(135deg, rgba(29, 43, 155, 0.9), rgba(15, 72, 129, 0.9));
        }

        .face-front {
            background: linear-gradient(135deg, rgba(22, 50, 113, 0.9), rgba(12, 28, 79, 0.9));
        }

        .face-right {
            transform: rotateY(90deg) translateZ(60px);
            background: linear-gradient(135deg, rgba(43, 55, 123, 0.9), rgba(25, 43, 92, 0.9));
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .maze-grid {
                grid-template-columns: repeat(8, 1fr);
            }
        }

        @media (max-width: 768px) {
            .maze-grid {
                grid-template-columns: repeat(6, 1fr);
            }
            .cell {
                height: 100px;
            }
            .cell-title {
                font-size: 1.2rem;
            }
            .maze-title {
                font-size: 3.2rem;
            }
        }

        @media (max-width: 480px) {
            .maze-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .cell {
                height: 90px;
            }
            .maze-title {
                font-size: 2.6rem;
            }
            .maze-desc {
                font-size: 1.1rem;
            }
        }

        /* 动画定义 */
        @keyframes twinkle {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @keyframes title-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes glow {
            0% { text-shadow: 0 0 10px rgba(139, 92, 246, 0.2); }
            50% { text-shadow: 0 0 20px rgba(139, 92, 246, 0.6); }
            100% { text-shadow: 0 0 10px rgba(139, 92, 246, 0.2); }
        }

        /* 特殊效果 */
        .glow {
            animation: glow 3s infinite;
        }

        /* 鼠标悬停效果 */
        .cell:hover .cell-3d {
            transform: rotateX(35deg) rotateY(35deg);
        }

        /* 404页 */
        .error {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--dark), #0a0f2b);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 20px var(--accent);
        }

        .error-text {
            font-weight: 900;
            margin-bottom: 40px;
            text-transform: uppercase;
            opacity: 0;
            animation: error-appear 1s 1.5s forwards;
        }

        .error-btn {
            padding: 15px 35px;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transform: scale(0.9);
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        .error-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.7);
        }

        /* 隐藏元素 */
        .hidden {
            display: none;
        }

        /* 粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -2;
            opacity: 0.2;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: move-particle 10s infinite linear;
        }

        @keyframes move-particle {
            0% { transform: translate(0, 0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(100px, 100px); opacity: 0; }
        }

        /* 联系按钮 */
        .contact-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.6);
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s;
        }

        .contact-btn:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.9);
        }

        /* 水印 */
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 1.2rem;
            opacity: 0.1;
            letter-spacing: 3px;
            z-index: -1;
        }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div class="star-bg" id="stars"></div>
    
    <!-- 水印 -->
    <div class="watermark">UNIQUE-000-STAR</div>
    
    <!-- 迷宫容器 -->
    <div class="maze-container">
        <h1 class="maze-title glow">星穹迷宫</h1>
        <p class="maze-desc">
            欢迎来到数字宇宙的终极迷宫。这里每一格都通往不同的时空维度，由量子数据编织而成。只有心灵纯净的旅人，才能找到通往星核的路径。
        </p>
        
      
        <!-- 粒子 -->
        <div class="particles" id="particles"></div>
    </div>
    
    <script>
        // 生成星空
        function createStars() {
            const stars = document.getElementById('stars');
            const count = 200;
            
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.width = `${Math.random() * 2 + 1}px`;
                star.style.height = `${Math.random() * 2 + 1}px`;
                star.style.opacity = Math.random();
                stars.appendChild(star);
            }
        }
        
        // 创建粒子
        function createParticles() {
            const particles = document.getElementById('particles');
            const count = 50;
            
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 10 + 5}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                particles.appendChild(particle);
            }
        }
        
        // 开启迷宫
        function openMaze(id) {
            // 模拟加载
            const loading = document.createElement('div');
            loading.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.8);
                display: flex;
                justify-content: center;
                align-items: center;
                color: white;
                font-size: 2rem;
                z-index: 1000;
                transform: scale(1.1);
                opacity: 0;
                animation: fadeIn 0.5s forwards;
            `;
            loading.textContent = `连接维度 ${id}...`;
            document.body.appendChild(loading);
            
            // 模拟延迟
            setTimeout(() => {
                const error = Math.random() > 0.8;
                if (error) {
                    document.getElementById('error').style.display = 'flex';
                    document.getElementById('error').style.animation = 'slideUp 0.5s forwards';
                } else {
                    window.location.href = `dimension-${id}.html`;
                }
            }, 1500);
        }
        
        // 重置错误
        function resetError() {
            document.getElementById('error').style.display = 'none';
        }
        
        // 联系开发者
        function contactDeveloper() {
            window.open('https://star-universe.net/contact', '_blank');
        }
        
        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            createStars();
            createParticles();
            
            // 添加鼠标移动效果
            document.addEventListener('mousemove', (e) => {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                const stars = document.querySelectorAll('.star');
                stars.forEach(star => {
                    star.style.transform = `translate(${x * 50}px, ${y * 50}px)`;
                });
                
                const particles = document.querySelectorAll('.particle');
                particles.forEach(particle => {
                    particle.style.transform = `translate(${x * 20}px, ${y * 20}px)`;
                });
            });
        });
    </script>
</body>
</html>
